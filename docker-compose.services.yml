include:
  - docker-compose.tools.yml

services:
  algashop-ordering:
    image: algashop/ordering:dev
    restart: no
    ports:
      - 8080:8080
    depends_on:
      algashop-postgres:
        condition: service_healthy
      algashop-redis:
        condition: service_healthy
      algashop-localstack:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 300s
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_TOMCAT_THREADS_MAX: 10 # 200
      SPRING_THREADS_VIRTUAL_ENABLED: true

  algashop-billing:
    image: algashop/billing:dev
    restart: no
    ports:
      - 8082:8082
    depends_on:
      algashop-ordering:
        condition: service_healthy
      algashop-localstack:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 256M
    environment:
      SPRING_PROFILES_ACTIVE: docker

  algashop-billing-scheduler:
    image: algashop/billing-scheduler:dev
    restart: no
    ports:
      - 8083:8083
    depends_on:
      algashop-billing:
        condition: service_healthy
      algashop-localstack:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:8083/actuator/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 256M
    environment:
      SPRING_PROFILES_ACTIVE: docker

  algashop-product-catalog:
    image: algashop/product-catalog:dev
    restart: no
    ports:
      - 8084:8084
    depends_on:
      algashop-mongodb-1:
        condition: service_healthy
      algashop-localstack:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:8084/actuator/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      SPRING_PROFILES_ACTIVE: docker

  algashop-authorization-server:
    image: algashop/authorization-server:dev
    restart: no
    hostname: auth.algashop.local
    ports:
      - 8081:8081
    depends_on:
      algashop-postgres:
        condition: service_healthy
      algashop-localstack:
        condition: service_healthy
    networks:
      default:
        aliases:
          - auth.algashop.local
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      SPRING_PROFILES_ACTIVE: docker
  algashop-service-registry:
    image: algashop/service-registry:dev
    restart: no
    ports:
      - 8761:8761
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      SPRING_PROFILES_ACTIVE: docker
  algashop-gateway-ecommerce:
    image: algashop/gateway-ecommerce:dev
    restart: on-failure
    ports:
      - 9999:9999
    depends_on:
      algashop-service-registry:
        condition: service_started
      algashop-authorization-server:
        condition: service_started
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:9999/actuator/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://algashop-service-registry:8761/eureka
  algashop-gateway-admin:
    image: algashop/gateway-admin:dev
    restart: on-failure
    hostname: admin-api.algashop.local
    ports:
      - 9998:9998
    depends_on:
      algashop-service-registry:
        condition: service_started
      algashop-authorization-server:
        condition: service_started
      algashop-redis:
        condition: service_healthy
    networks:
      default:
        aliases:
          - admin-api.algashop.local
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:9998/actuator/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      SPRING_PROFILES_ACTIVE: docker
